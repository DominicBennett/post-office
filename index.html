<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ruslan Russian Vocab Trainer</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .flashcard-inner {
      transition: transform 0.6s;
      transform-style: preserve-3d;
      cursor: pointer;
    }
    .flipped { transform: rotateY(180deg); }
    .flashcard-front, .flashcard-back {
      backface-visibility: hidden;
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
    }
    .flashcard-back { transform: rotateY(180deg); }
  </style>
</head>
<body class="bg-slate-50 min-h-screen font-sans">
  <div id="app" class="max-w-2xl mx-auto p-4 md:p-8 space-y-6">
    <header class="text-center space-y-3">
      <h1 class="text-3xl font-bold text-slate-800">Ruslan Russian Trainer</h1>
      
      <!-- Lesson Selector -->
      <div class="flex justify-center items-center gap-2">
        <label for="lessonSelect" class="text-sm font-medium text-slate-600">Select Lesson:</label>
        <select id="lessonSelect" onchange="changeLesson()" class="bg-white border border-slate-300 text-slate-700 text-sm rounded-lg p-2 focus:ring-blue-500 focus:border-blue-500 shadow-sm">
          <option value="2">Lesson 2</option>
          <option value="3" selected>Lesson 3</option>
          <option value="all">All Lessons</option>
        </select>
      </div>

      <div class="flex justify-between items-center px-4 mt-4">
        <span class="text-xs font-medium text-slate-500" id="progressText">Progress: 0%</span>
        <div class="w-48 h-2 bg-slate-200 rounded-full overflow-hidden">
          <div id="progressBar" class="h-full bg-blue-500 transition-all duration-300" style="width: 0%"></div>
        </div>
      </div>
    </header>

    <!-- Tabs Navigation -->
    <div class="flex border-b border-slate-200">
      <button onclick="switchTab('study')" id="tab-study" class="flex-1 py-2 text-sm font-medium border-b-2 border-blue-500 text-blue-600">Study</button>
      <button onclick="switchTab('quiz')" id="tab-quiz" class="flex-1 py-2 text-sm font-medium border-b-2 border-transparent text-slate-500">Quiz</button>
      <button onclick="switchTab('writing')" id="tab-writing" class="flex-1 py-2 text-sm font-medium border-b-2 border-transparent text-slate-500">Writing</button>
    </div>

    <!-- Study View -->
    <div id="view-study" class="space-y-6">
      <div class="relative h-64 w-full">
        <div id="flashcard" class="flashcard-inner relative w-full h-full bg-white rounded-xl shadow-lg border border-slate-200" onclick="toggleFlip()">
          <div class="flashcard-front p-6 text-center">
            <div id="card-ru" class="text-4xl font-bold text-blue-600 mb-2">Загрузка...</div>
            <div id="card-type" class="text-xs uppercase tracking-widest text-slate-400 font-semibold"></div>
            <div class="absolute bottom-4 text-[10px] text-slate-300">Click to reveal English</div>
          </div>
          <div class="flashcard-back p-6 text-center bg-blue-50">
            <div id="card-en" class="text-3xl font-medium text-slate-700 mb-2">Translation</div>
            <div id="card-note" class="text-xs italic text-orange-600 bg-white px-3 py-1 rounded-full border border-orange-100 hidden"></div>
          </div>
        </div>
      </div>
      <div class="flex justify-between">
        <button onclick="prevWord()" class="px-4 py-2 border rounded bg-white hover:bg-slate-50 active:bg-slate-100">Previous</button>
        <button onclick="nextWord()" class="px-4 py-2 bg-blue-600 text-white rounded hover:bg-blue-700">Next Word</button>
      </div>
    </div>

    <!-- Quiz View -->
    <div id="view-quiz" class="hidden space-y-6">
      <div class="bg-white p-8 rounded-xl shadow-md border border-slate-100 text-center">
        <div id="quiz-ru" class="text-4xl font-bold text-blue-600 mb-8">Russian Word</div>
        <div id="quiz-options" class="grid grid-cols-1 md:grid-cols-2 gap-3">
          <!-- Options injected here -->
        </div>
        <div id="quiz-feedback" class="mt-4 h-6 font-medium"></div>
      </div>
    </div>

    <!-- Writing View -->
    <div id="view-writing" class="hidden space-y-6">
      <div class="bg-white p-6 rounded-xl shadow-md border border-slate-100">
        <div class="text-center mb-6">
          <div class="text-sm text-slate-400">Translate to Russian:</div>
          <div id="write-en" class="text-2xl font-bold">English Word</div>
        </div>
        <input type="text" id="write-input" class="w-full text-center text-xl h-14 border rounded-lg focus:ring-2 focus:ring-blue-400 outline-none mb-4" placeholder="Type in Cyrillic...">
        <div class="flex gap-2 mb-6">
          <button onclick="checkWriting()" class="flex-1 bg-blue-600 text-white py-3 rounded-lg font-bold hover:bg-blue-700">Check</button>
          <button onclick="showHint()" class="px-6 border rounded-lg hover:bg-slate-50">Hint</button>
        </div>
        
        <!-- Onscreen Keyboard -->
        <div class="p-2 bg-slate-100 rounded-lg" id="kybd">
          <!-- Rows injected here -->
        </div>
      </div>
    </div>

    <footer class="text-center text-[10px] text-slate-400 mt-12">
      Source: Ruslan Russian 2
    </footer>
  </div>

  <script>
    const DATASETS = {
      "2": [
        { ru: "работник", en: "worker", type: "noun" },
        { ru: "почта", en: "the post", type: "noun" },
        { ru: "конверт", en: "envelope", type: "noun" },
        { ru: "желать", en: "to wish (someone something)", notes: "+ genitive", type: "verb", full: "желать / по-" },
        { ru: "счастье", en: "happiness", type: "noun" },
        { ru: "здоровье", en: "health", type: "noun" },
        { ru: "другой", en: "other", type: "adj" },
        { ru: "некрасивый", en: "ugly", type: "adj" },
        { ru: "выбирать", en: "to choose", type: "verb", full: "выбирать / выбрать" },
        { ru: "получать", en: "to receive", type: "verb", full: "получать / получить" },
        { ru: "марка", en: "a stamp", type: "noun" },
        { ru: "до востребования", en: "for collection (letters)", type: "phrase" },
        { ru: "посылать", en: "to send", type: "verb", full: "посылать / послать" },
        { ru: "письмо", en: "letter", type: "noun" },
        { ru: "пугать", en: "to frighten", type: "verb", full: "пугать / испугать" },
        { ru: "знакомиться", en: "to get acquainted", type: "verb", full: "знакомиться / по-" },
        { ru: "покупать", en: "to buy", type: "verb", full: "покупать / купить" },
        { ru: "менять", en: "to change (something)", type: "verb", full: "менять / по-" },
        { ru: "открытка", en: "postcard", type: "noun" },
        { ru: "обмен", en: "exchange", type: "noun" },
        { ru: "вид", en: "view", type: "noun" },
        { ru: "валюта", en: "currency", type: "noun" },
        { ru: "фунт", en: "a pound", type: "noun" },
        { ru: "посылка", en: "parcel", type: "noun" },
        { ru: "прохожий", en: "passer-by (m.)", type: "noun" },
        { ru: "пенсия", en: "pension", type: "noun" },
        { ru: "прохожая", en: "passer-by (f.)", type: "noun" },
        { ru: "бандероль", en: "printed matter (by post)", notes: "feminine", type: "noun" },
        { ru: "просто", en: "simple", type: "adv" },
        { ru: "угол", en: "corner", type: "noun" },
        { ru: "десятый", en: "the tenth", type: "numeral" },
        { ru: "район", en: "region / district", type: "noun" }
      ],
      "3": [
        { ru: "погода", en: "weather", type: "noun" },
        { ru: "чаще", en: "more often", type: "adv" },
        { ru: "чем", en: "than", type: "conj" },
        { ru: "наверно", en: "probably", type: "adv" },
        { ru: "меняться", en: "to change (itself)", type: "verb", full: "меняться / по-" },
        { ru: "климат", en: "climate", type: "noun" },
        { ru: "континентальный", en: "continental", type: "adj" },
        { ru: "снежный", en: "snowy", type: "adj" },
        { ru: "градус", en: "degree", type: "noun" },
        { ru: "мороз", en: "frost", type: "noun" },
        { ru: "короткий", en: "short", type: "adj" },
        { ru: "жаркий", en: "warm", type: "adj" },
        { ru: "время года", en: "season", type: "phrase" },
        { ru: "больше", en: "more", type: "adv" },
        { ru: "особенно", en: "especially", type: "adv" },
        { ru: "ночь", en: "night", notes: "feminine", type: "noun" },
        { ru: "снег", en: "snow", type: "noun" },
        { ru: "ветер", en: "wind", type: "noun" },
        { ru: "поэма", en: "(long) poem", type: "noun" },
        { ru: "литература", en: "literature", type: "noun" },
        { ru: "туман", en: "fog", type: "noun" },
        { ru: "дождь", en: "rain", notes: "masculine", type: "noun" },
        { ru: "ерунда", en: "nonsense", type: "noun" },
        { ru: "меньше", en: "less", type: "adv" },
        { ru: "недавно", en: "recently", type: "adv" },
        { ru: "лучше", en: "better", type: "adv" },
        { ru: "тепло", en: "it is warm", type: "adv" },
        { ru: "светить", en: "to shine", type: "verb", full: "светить / по-" },
        { ru: "солнце", en: "sun", type: "noun" },
        { ru: "Крым", en: "the Crimea", type: "noun" },
        { ru: "по-моему", en: "in my opinion", type: "phrase" },
        { ru: "полтора", en: "one and a half", type: "numeral" },
        { ru: "человек", en: "person / of people", type: "noun" },
        { ru: "столица", en: "capital", type: "noun" },
        { ru: "Великобритания", en: "Great Britain", type: "noun" },
        { ru: "бывать", en: "to be (regularly)", type: "verb" },
        { ru: "хуже", en: "worse", type: "adv" },
        { ru: "редко", en: "rarely", type: "adv" },
        { ru: "юг", en: "south", type: "noun" },
        { ru: "страна", en: "country", type: "noun" },
        { ru: "крикет", en: "cricket", type: "noun" },
        { ru: "курить", en: "to smoke", type: "verb", full: "курить / по-" },
        { ru: "машина", en: "car, vehicle", type: "noun" },
        { ru: "дешевый", en: "cheap", type: "adj" },
        { ru: "ВАЗ", en: "Lada", type: "noun" },
        { ru: "оставлять", en: "to leave", type: "verb", full: "оставлять / оставить" },
        { ru: "весна", en: "spring", type: "noun" },
        { ru: "лето", en: "summer", type: "noun" },
        { ru: "осень", en: "autumn", notes: "feminine", type: "noun" },
        { ru: "зима", en: "winter", type: "noun" },
        { ru: "север", en: "north", type: "noun" },
        { ru: "северо-запад", en: "north-west", type: "noun" },
        { ru: "северо-восток", en: "north-east", type: "noun" },
        { ru: "запад", en: "west", type: "noun" },
        { ru: "восток", en: "east", type: "noun" },
        { ru: "юго-запад", en: "south-west", type: "noun" },
        { ru: "юго-восток", en: "south-east", type: "noun" }
      ]
    };

    let VOCAB = [];
    let currentIndex = 0;
    let isFlipped = false;

    function changeLesson() {
      const selected = document.getElementById('lessonSelect').value;
      if (selected === 'all') {
        VOCAB = [...DATASETS['2'], ...DATASETS['3']];
      } else {
        VOCAB = DATASETS[selected];
      }
      currentIndex = 0;
      isFlipped = false;
      document.getElementById('flashcard').classList.remove('flipped');
      updateStudyCard();
      setupQuiz();
      setupWriting();
    }

    function switchTab(tab) {
      ['study', 'quiz', 'writing'].forEach(t => {
        document.getElementById(`view-${t}`).classList.add('hidden');
        document.getElementById(`tab-${t}`).className = 'flex-1 py-2 text-sm font-medium border-b-2 border-transparent text-slate-500';
      });
      document.getElementById(`view-${tab}`).classList.remove('hidden');
      document.getElementById(`tab-${tab}`).className = 'flex-1 py-2 text-sm font-medium border-b-2 border-blue-500 text-blue-600';

      if (tab === 'quiz') setupQuiz();
      if (tab === 'writing') setupWriting();
    }

    // Study Logic
    function toggleFlip() {
      isFlipped = !isFlipped;
      document.getElementById('flashcard').classList.toggle('flipped', isFlipped);
    }

    function updateStudyCard() {
      const item = VOCAB[currentIndex];
      document.getElementById('card-ru').innerText = item.full || item.ru;
      document.getElementById('card-type').innerText = item.type || '';
      document.getElementById('card-en').innerText = item.en;
      
      const noteEl = document.getElementById('card-note');
      if (item.notes) {
        noteEl.innerText = item.notes;
        noteEl.classList.remove('hidden');
      } else {
        noteEl.classList.add('hidden');
      }

      document.getElementById('progressText').innerText = `Progress: ${Math.round(((currentIndex + 1) / VOCAB.length) * 100)}%`;
      document.getElementById('progressBar').style.width = `${((currentIndex + 1) / VOCAB.length) * 100}%`;
    }

    function nextWord() {
      if (isFlipped) toggleFlip();
      setTimeout(() => {
        currentIndex = (currentIndex + 1) % VOCAB.length;
        updateStudyCard();
      }, isFlipped ? 300 : 0);
    }

    function prevWord() {
      if (isFlipped) toggleFlip();
      setTimeout(() => {
        currentIndex = (currentIndex - 1 + VOCAB.length) % VOCAB.length;
        updateStudyCard();
      }, isFlipped ? 300 : 0);
    }

    // Quiz Logic
    let currentQuizItem = null;
    function setupQuiz() {
      currentQuizItem = VOCAB[Math.floor(Math.random() * VOCAB.length)];
      document.getElementById('quiz-ru').innerText = currentQuizItem.ru;
      document.getElementById('quiz-feedback').innerText = '';

      let options = [currentQuizItem.en];
      while (options.length < 4 && options.length < VOCAB.length) {
        let rand = VOCAB[Math.floor(Math.random() * VOCAB.length)].en;
        if (!options.includes(rand)) options.push(rand);
      }
      options.sort(() => Math.random() - 0.5);

      const optsContainer = document.getElementById('quiz-options');
      optsContainer.innerHTML = '';
      options.forEach(opt => {
        const btn = document.createElement('button');
        btn.className = 'p-4 border rounded-lg hover:bg-slate-50 transition font-medium text-slate-700 text-left';
        btn.innerText = opt;
        btn.onclick = () => checkQuiz(opt, btn);
        optsContainer.appendChild(btn);
      });
    }

    function checkQuiz(selected, btn) {
      const feedback = document.getElementById('quiz-feedback');
      if (selected === currentQuizItem.en) {
        btn.className = 'p-4 border rounded-lg bg-green-500 text-white font-medium text-left';
        feedback.className = 'mt-4 h-6 font-medium text-green-600';
        feedback.innerText = 'Correct!';
        setTimeout(setupQuiz, 1200);
      } else {
        btn.className = 'p-4 border rounded-lg bg-red-500 text-white font-medium text-left';
        feedback.className = 'mt-4 h-6 font-medium text-red-500';
        feedback.innerText = 'Try again!';
      }
    }

    // Writing Logic
    let currentWriteItem = null;
    function setupWriting() {
      currentWriteItem = VOCAB[Math.floor(Math.random() * VOCAB.length)];
      document.getElementById('write-en').innerText = currentWriteItem.en;
      const input = document.getElementById('write-input');
      input.value = '';
      input.className = 'w-full text-center text-xl h-14 border rounded-lg focus:ring-2 focus:ring-blue-400 outline-none mb-4';
    }

    function checkWriting() {
      const input = document.getElementById('write-input');
      const val = input.value.trim().toLowerCase();
      const target = currentWriteItem.ru.toLowerCase();

      if (val === target) {
        input.className = 'w-full text-center text-xl h-14 border-2 border-green-500 bg-green-50 rounded-lg outline-none mb-4';
        setTimeout(setupWriting, 1000);
      } else {
        input.className = 'w-full text-center text-xl h-14 border-2 border-red-500 bg-red-50 rounded-lg outline-none mb-4';
      }
    }

    function showHint() {
      const input = document.getElementById('write-input');
      input.value = currentWriteItem.ru.substring(0, Math.max(1, input.value.length + 1));
    }

    // On-screen Russian Keyboard
    const KEYBOARD_ROWS = [
      ['й','ц','у','к','е','н','г','ш','щ','з','х','ъ'],
      ['ф','ы','в','а','п','р','о','л','д','ж','э'],
      ['я','ч','с','м','и','т','ь','б','ю','<-']
    ];

    function renderKeyboard() {
      const container = document.getElementById('kybd');
      container.innerHTML = '';
      KEYBOARD_ROWS.forEach(row => {
        const rowDiv = document.createElement('div');
        rowDiv.className = 'flex justify-center gap-1 mb-1';
        row.forEach(key => {
          const btn = document.createElement('button');
          btn.className = 'bg-white shadow px-2.5 py-2 rounded text-sm font-semibold active:bg-slate-200 flex-1 max-w-[40px]';
          btn.innerText = key;
          btn.onclick = () => {
            const input = document.getElementById('write-input');
            if (key === '<-') {
              input.value = input.value.slice(0, -1);
            } else {
              input.value += key;
            }
          };
          rowDiv.appendChild(btn);
        });
        container.appendChild(rowDiv);
      });
    }

    // Initialize
    renderKeyboard();
    changeLesson();
  </script>
</body>
</html>
